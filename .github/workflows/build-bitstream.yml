name: Build TOTAL Shield Bitstream (Vivado)

on:
  workflow_dispatch:                  # Ручной запуск из вкладки Actions
  push:
    branches: [ main ]
    paths:
      - 'fpga_shield/rtl/*.v'        # Автозапуск при изменении RTL
      - 'fpga_shield/constraints/*.xdc'

jobs:
  build:
    name: Synthesize for Arty A7-100T
    runs-on: ubuntu-latest

    steps:
      # 1. Загружаем ваш код из репозитория
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Скачиваем и устанавливаем Vivado (бесплатная версия для CI)
      # Это самый долгий шаг (~15-20 минут при первом запуске)
      - name: Setup Vivado
        uses: live-codes/vivado-setup-action@v1
        with:
          version: '2024.1'
          edition: 'WebPACK'

      # 3. Подготавливаем файл с настройками окружения
      - name: Configure Environment
        run: |
          echo "source /opt/Xilinx/Vivado/2024.1/settings64.sh" > setup.tcl
          echo "cd fpga_shield/synth" >> setup.tcl

      # 4. Запуск синтеза, имплементации и генерации битстрима
      # Скрипт run_impl.tcl должен у вас быть (мы его писали ранее)
      - name: Run Synthesis
        run: |
          vivado -mode batch -source setup.tcl -source run_impl.tcl
        working-directory: fpga_shield/synth

      # 5. Копируем собранный .bit файл в папку с артефактами
      - name: Collect Bitstream
        run: |
          mkdir -p artifacts
          find . -name "*.bit" -exec cp {} artifacts/ \;
          find . -name "*.ltx" -exec cp {} artifacts/ \;
        working-directory: .

      # 6. Загружаем артефакты (результат сборки) на GitHub
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: total-shield-bitstream
          path: artifacts/
          if-no-files-found: error
